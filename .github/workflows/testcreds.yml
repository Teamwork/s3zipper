name: creds-check-temp
on: pull_request
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ECR_MASTER_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ECR_MASTER_SECRET_ACCESS_KEY }}
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: AWS key
        run: |
          echo "Key ID ends: ${AWS_ACCESS_KEY_ID: -4}"
          command -v aws >/dev/null || pip install -q awscli
          aws sts get-caller-identity --query '[Account,Arn]' --output text 2>&1 | sed 's/^/STS: /'
      - name: Docker Hub token
        run: |
          echo "$DH_USER" | sed 's/./& /g'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://hub.docker.com/v2/users/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$DH_USER\",\"password\":\"$DH_TOKEN\"}")
          echo "Docker Hub login HTTP $code (200 = token valid, 401 = invalid)"
